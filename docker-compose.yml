# ─────────────────────────────────────────────────────────────────────────────
#  The hub, as it runs in production.
#
#  One service. The Gateway relayer, the ENS name sponsor and the index proxy
#  are routes on a single server sharing one funded wallet and one spend ledger
#  (see hub/Dockerfile for why that is not split).
#
#    docker compose up --build -d
#    curl localhost:8787/healthz
#
#  Secrets come from hub/.env, which is gitignored and never enters the image.
# ─────────────────────────────────────────────────────────────────────────────
name: mercury

services:
  hub:
    build:
      context: ./hub
      target: runtime
    image: mercury-hub:local
    restart: unless-stopped

    env_file:
      # Optional so a fresh clone can still `up` and get a hub that reports
      # itself unconfigured, rather than a compose error about a missing file.
      - path: ./hub/.env
        required: false

    environment:
      # Pinned so the published port is knowable regardless of what .env says.
      PORT: 8787
      HOST: 0.0.0.0

    ports:
      # HUB_PORT moves the host side only; the container always listens on 8787.
      - "${HUB_PORT:-8787}:8787"

    volumes:
      # The budget ledgers are the only state this service has, and they are the
      # record of what has already been spent. On an anonymous layer they reset
      # every deploy, which hands every wallet its sponsorship allowance again.
      - hub-data:/app/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    # The relayer signs with a key held in memory; nothing here needs to write
    # outside its ledger volume.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  hub-data:
