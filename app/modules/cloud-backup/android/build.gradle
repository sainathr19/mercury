plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.cloudbackup'
version = '1.0.0'

android {
  namespace "expo.modules.cloudbackup"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Google Drive REST API client + auth, used to store the opaque backup blob
  // in the user's private Drive `appDataFolder` scope.
  //
  // NOTE (configured later): the Drive OAuth scope (DriveScopes.DRIVE_APPDATA)
  // and a signed-in GoogleAccountCredential must be wired up by the app's
  // Google Sign-In flow before these calls succeed — see DriveBackupStore.
  implementation 'com.google.android.gms:play-services-auth:21.2.0'
  implementation('com.google.api-client:google-api-client-android:2.6.0') {
    exclude group: 'org.apache.httpcomponents'
  }
  implementation('com.google.apis:google-api-services-drive:v3-rev20240914-2.0.0') {
    exclude group: 'org.apache.httpcomponents'
  }
  implementation 'com.google.http-client:google-http-client-gson:1.44.2'
}
